<!DOCTYPE html>
<html>
<head>
  <title>Business Idea Judge</title>
<style>
#result::first-line {
  font-size: 26px;
  font-weight: bold;
}
#result > div {
  margin-bottom: 14px;
}
#result > div:first-child {
  font-size: 28px;
  font-weight: bold;
  margin-bottom: 18px;
}
#result > div:not(:first-child) strong {
  display: block;
  font-size: 14px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
</style>
</head>

<body style="font-family: Arial; max-width: 700px; margin: 60px auto; background: #f5f5f5; padding: 30px;">
  <h1>Business Idea Judge</h1>
<p>Describe your business idea and get a score out of 100.</p>
<textarea id="idea" placeholder="Type your business idea here..." style="width: 100%; height: 120px; border-radius: 8px; padding: 12px; font-size: 16px;"></textarea>
<br>
<button style="padding: 14px 24px; margin-top: 14px; font-size: 16px; background: #111; color: white; border: none; border-radius: 8px; cursor: pointer;" onclick="sendIdea()">
  Judge My Idea
</button>
<div id="result" style="display: none; white-space: pre-line; margin-top: 20px; background: white; padding: 24px; border-radius: 12px; border: 1px solid #e5e5e5; box-shadow: 0 8px 24px rgba(0,0,0,0.06); line-height: 1.6;"></div>
<script>
async function sendIdea() {
  const idea = document.getElementById("idea").value;
if (!idea.trim()) {
  document.getElementById("result").style.display = "block";
  document.getElementById("result").textContent = "Type a business idea first.";
  return;
}
document.getElementById("result").style.display = "block";
document.getElementById("result").textContent = "Analyzing your idea...";

try {

  const response = await fetch("/judge", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({idea: idea})
  });

  const data = await response.json();
document.getElementById("result").style.display = "block";
  const result = document.getElementById("result");
result.innerHTML = "";

data.idea.split("\n").forEach(line => {
  const row = document.createElement("div");
  const colon = line.indexOf(":");

  if (colon !== -1) {
    const title = document.createElement("strong");
    title.textContent = line.slice(0, colon + 1);
title.style.display = "block";
title.style.textTransform = "uppercase";

    row.appendChild(title);
    row.appendChild(document.createTextNode(line.slice(colon + 1)));
  } else {
    row.textContent = line;
  }

  result.appendChild(row);
});
} catch (error) {
  document.getElementById("result").textContent = "Something went wrong. Please try again.";
}
}
</script>
</body>
</html>
